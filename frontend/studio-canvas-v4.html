<!doctype html><html data-theme="dark" lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio Canvas · KimKim</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="studio-workspace.css?v=studio-4"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Inter,Arial,sans-serif;--text-0:var(--tx);--text-1:var(--tx);--text-2:var(--mu);--border:var(--bd);--surface:var(--card);--field:var(--inp)}.preview-banner{display:flex;justify-content:space-between;gap:12px;padding:12px 24px;background:var(--sb);border-bottom:1px solid var(--bd);font-size:11px;color:var(--mu)}button,input,textarea{font:inherit;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 12px}button{cursor:pointer}.btn-primary{background:var(--b1);color:var(--bt)}button:disabled{cursor:default;opacity:.65}.hidden{display:none!important}.page-heading{display:flex;justify-content:space-between}.akk-icon{width:16px;height:16px;vertical-align:middle}.tag{display:inline-block}.view-title{font-weight:700}.view-sub{color:var(--mu)}textarea{width:100%}input{width:100%}#mdMeetBotBar{display:none!important} .preview-banner{align-items:center}.preview-controls{display:flex;gap:6px}.preview-controls button{font-size:11px;white-space:nowrap}.preview-controls [aria-pressed=true]{border-color:var(--ac);color:var(--ac)}@media(max-width:600px){.preview-banner{padding:10px 16px;flex-wrap:wrap;gap:8px}}</style><div class="preview-banner"><span id="previewNotice"></span><div class="preview-controls"><button data-preview-lang="vi" onclick="previewLocale('vi')">VIE</button><button data-preview-lang="en" onclick="previewLocale('en')">ENG</button><button id="previewTheme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'"></button></div></div>    <div class="view" id="view-meetingDetail">

<script src="localizations/vi-vn.js?v=studio-4"></script><script src="localizations/eng-en.js?v=studio-4"></script><script>let studioContentTab='summary';
function showMeetingTab(which){
  const chat=which==='chat';
  if(!chat) studioContentTab=which==='transcript'?'transcript':'summary';
  for(const name of ['summary','transcript']){
    const selected=studioContentTab===name;
    const button=document.getElementById(name==='summary'?'mdTabSummaryBtn':'mdTabTranscriptBtn');
    button?.classList.toggle('active',selected);
    button?.setAttribute('aria-selected',String(selected));
    document.getElementById(name==='summary'?'mdSummaryPane':'mdTranscriptPane')?.classList.toggle('hidden',!selected);
  }
  document.getElementById('meetingDetailBody')?.classList.toggle('studio-chat-open',chat);
  if(chat && window.matchMedia?.('(max-width:900px)')?.matches){requestAnimationFrame(()=>document.getElementById('mdChatColumn')?.scrollIntoView({block:'start',behavior:'smooth'}));}
  for(const [id,selected] of [['mdMobileContentBtn',!chat],['mdTabChatBtn',chat]]){
    const button=document.getElementById(id);button?.classList.toggle('active',selected);button?.setAttribute('aria-selected',String(selected));
  }
}


let previewLang='vi';
function previewLocale(next){previewLang=next;const d=window.I18N[next];document.documentElement.lang=next;document.querySelectorAll('[data-i18n]').forEach(el=>{if(d[el.dataset.i18n])el.textContent=d[el.dataset.i18n]});document.querySelectorAll('[data-i18n-ph]').forEach(el=>{if(d[el.dataset.i18nPh])el.placeholder=d[el.dataset.i18nPh]});document.querySelectorAll('[data-i18n-aria]').forEach(el=>{if(d[el.dataset.i18nAria])el.setAttribute('aria-label',d[el.dataset.i18nAria])});document.querySelectorAll('[data-i18n-title]').forEach(el=>{if(d[el.dataset.i18nTitle])el.title=d[el.dataset.i18nTitle]});
document.querySelector('#view-meetingDetail>.view-title').textContent=next==='vi'?'Họp sản phẩm hằng tuần':'Product weekly';document.querySelector('#view-meetingDetail>.view-sub').textContent='03/11/2026 · 09:00 · 34:29';mdSourceMeta.innerHTML='<span class="studio-meta-chip">WEBM</span><span class="studio-meta-chip">KimKim Meeting</span><span class="studio-result-chip">'+d.studioResultSaved+'</span>';btnQuickSummarize.textContent=d.studioSummarize;
mdSummary.innerHTML=next==='vi'?'<p>Nhóm đã rà soát tiến độ phát hành, thống nhất các ưu tiên và xác định những việc còn phụ thuộc.</p><p>Tuần này tập trung hoàn tất kiểm thử chất lượng và chuẩn bị tài liệu phát hành.</p>':'<p>The team reviewed release progress, agreed on priorities and identified remaining dependencies.</p><p>This week: complete quality checks and prepare release materials.</p>';
mdKeyPoints.innerHTML='<ul class="studio-keypoints">'+(next==='vi'?['Các tính năng chính đã sẵn sàng để rà soát.','Kế hoạch chuyển dữ liệu cần được xác nhận.']:['Core features are ready for review.','The data migration plan needs confirmation.']).map(s=>'<li>'+s+'</li>').join('')+'</ul>';
mdActionItems.innerHTML='<ul>'+(next==='vi'?['Xác nhận kế hoạch chuyển dữ liệu với đội kỹ thuật.','Chuẩn bị ghi chú phát hành và hoàn tất QA.']:['Confirm the migration plan with engineering.','Prepare release notes and complete QA.']).map(s=>'<li>'+s+'</li>').join('')+'</ul>';
mdParticipants.innerHTML='<span class="tag">'+(next==='vi'?'Người nói 01':'Speaker 01')+'</span><span class="tag">'+(next==='vi'?'Người nói 02':'Speaker 02')+'</span>';
segList.innerHTML='<div class="seg"><div class="meta">'+(next==='vi'?'Người nói 01':'Speaker 01')+' · 00:00</div><p>'+(next==='vi'?'Mình cùng rà soát các ưu tiên phát hành và những việc còn phụ thuộc.':'Let’s review release priorities and remaining dependencies.')+'</p></div><div class="seg"><div class="meta">'+(next==='vi'?'Người nói 02':'Speaker 02')+' · 00:24</div><p>'+(next==='vi'?'Các tính năng chính đã sẵn sàng. Mình cần xác nhận kế hoạch chuyển dữ liệu.':'Core features are ready. We need to confirm the migration plan.')+'</p></div>';
document.getElementById('previewNotice').textContent=next==='vi'?'XEM THỬ GIAO DIỆN · DỮ LIỆU MẪU':'LAYOUT PREVIEW · SAMPLE DATA';document.getElementById('previewTheme').textContent=next==='vi'?'Sáng / Tối':'Light / Dark';document.querySelectorAll('[data-preview-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.previewLang===next)));}
document.querySelector('.video-controls').classList.add('hidden');previewLocale('vi');showMeetingTab('summary');
if(new URLSearchParams(location.search).has('mobile')){document.body.innerHTML='<iframe title="Mobile Studio Canvas" src="studio-canvas-v4.html?frame=studio-4" style="width:390px;height:844px;border:1px solid var(--bd);border-radius:18px;display:block;margin:20px auto;background:var(--bg)"></iframe>';}
</script></html>
