<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b1f"><title>Adolf KimKim · Offline</title>
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#050b1f;color:#e8edf7;font:16px/1.6 system-ui,sans-serif}main{max-width:420px;margin:24px;padding:32px;border:1px solid #1e3a68;border-radius:16px;background:#0b1734}h1{color:#93a4c3;font-size:24px}button{background:#2f64ec;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}p{color:#a8b6ce}</style></head>
<body><main><h1>ADOLF KIMKIM</h1><p id="message">Bạn đang ngoại tuyến. Kết nối lại Internet để đăng nhập, mở dữ liệu cuộc họp và dùng AI.</p><button id="retry" onclick="location.reload()">Thử lại</button></main>
<script>let en=false;try{en=localStorage.getItem('akk_lang')==='en'}catch{}if(en){document.documentElement.lang='en';document.getElementById('message').textContent='You are offline. Reconnect to sign in, open meeting data and use AI.';document.getElementById('retry').textContent='Try again'}window.addEventListener('online',()=>location.reload())</script></body></html>
